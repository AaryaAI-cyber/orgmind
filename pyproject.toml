[project]
name = "orgmind"
version = "1.0.0"
description = "Real-Time AI Organizational Intelligence System"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "pydantic==2.10.4",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
